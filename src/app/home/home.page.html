<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Pokedex</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Pokedex</ion-title>
    </ion-toolbar>
  </ion-header>

  <section class="content-wrapper">
    @if (isLoading()) {
      <div class="state-message">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Loading Pokemon...</p>
      </div>
    } @else {
      @if (errorMessage()) {
        <ion-text color="danger">
          <p class="state-message">{{ errorMessage() }}</p>
        </ion-text>
      }

      <div class="pokemon-list">
        @for (pokemon of pokemons(); track pokemon.id) {
          <ion-card class="pokemon-card" [routerLink]="['/pokemon', pokemon.id]" button="true">
            <ion-card-content>
              <ion-img [src]="pokemon.image" [alt]="pokemon.name"></ion-img>
              <h2>{{ pokemon.name }}</h2>
              <ion-button
                class="favorite-button"
                fill="clear"
                size="small"
                [attr.aria-label]="favoritesService.isFavorite(pokemon.id) ? 'Remove from favorites' : 'Add to favorites'"
                (click)="toggleFavorite($event, pokemon.id)"
              >
                <ion-icon
                  slot="icon-only"
                  [name]="favoritesService.isFavorite(pokemon.id) ? 'heart' : 'heart-outline'"
                  [color]="favoritesService.isFavorite(pokemon.id) ? 'danger' : 'medium'"
                ></ion-icon>
              </ion-button>
            </ion-card-content>
          </ion-card>
        }
      </div>

      <ion-infinite-scroll threshold="100px" [disabled]="!hasMorePokemon()" (ionInfinite)="loadMorePokemons($event)">
        <ion-infinite-scroll-content loadingSpinner="crescent" loadingText="Loading more Pokemon...">
        </ion-infinite-scroll-content>
      </ion-infinite-scroll>
    }
  </section>
</ion-content>
